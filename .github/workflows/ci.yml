name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Verify MCP SDK import
        run: node -e "import('./packages/mcp-server/src/index.mjs').then(()=>console.log('MCP server import OK'))"
